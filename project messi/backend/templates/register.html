<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Your Account ✍️💚</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f1de;
      color: #333;
      text-align: center;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1.5s ease-in-out;
      padding: 20px;
    }

    h1 {
      font-size: 2.5em;
      font-weight: 700;
      margin-bottom: 10px;
      animation: bounceIn 1.5s ease-out;
    }

    form {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 500px;
      text-align: left;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      padding-right: 40px;
    }

    .toggle-eye {
      position: absolute;
      right: 10px;
      cursor: pointer;
      user-select: none;
      font-size: 1.2rem;
      color: #666;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
      font-size: 1rem;
    }

    button:hover {
      background: #388e3c;
    }

    .link {
      margin-top: 15px;
    }

    .link a {
      text-decoration: none;
      color: #4caf50;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.1); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Create Your Account ✍️💚</h1>
    <form id="registerForm" action="#" method="POST">
      <label for="name">🙋 Full Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">📧 Email</label>
      <input type="email" id="email" name="email" required />

      <label for="password">🔒 Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password" required />
        <span id="togglePassword" class="toggle-eye">👁️</span>
      </div>

      <button type="submit">Register ✅</button>
    </form>

    <p class="link">Already have an account? <a href="/login">Login Here 🔑</a></p>
    <p class="link"><a href="/">⬅️ Back to Home</a></p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("registerForm");
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");

      togglePassword.addEventListener("click", function () {
        const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
        passwordInput.setAttribute("type", type);
        togglePassword.textContent = type === "password" ? "👁️" : "🙈";
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          const response = await fetch("http://127.0.0.1:5000/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password }),
          });

          const result = await response.json();
          console.log("Server Response:", result);

          if (response.ok) {
            alert(result.message || "Registration successful!");
            if (result.redirect) {
              window.location.href = result.redirect;
            }
          } else {
            alert(result.message || "Failed to register.");
          }
        } catch (error) {
          console.error("Error:", error);
          alert("Something went wrong!");
        }
      });
    });
  </script>
</body>
</html>
