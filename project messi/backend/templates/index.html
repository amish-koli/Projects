<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Health 🌿💪</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f1de;
            color: #333;
            text-align: center;
            overflow: hidden;
        }
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 10px;
            animation: bounceIn 1.5s ease-out;
        }
        p {
            font-size: 1.2em;
            font-weight: 300;
            margin-bottom: 20px;
            animation: slideInUp 1s ease-out;
        }
        .buttons {
            display: flex;
            gap: 15px;
            animation: fadeIn 2s ease-in-out;
        }
        button {
            padding: 12px 20px;
            font-size: 1.2em;
            font-weight: 400;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
        }
        .login { background: #4caf50; }
        .register { background: #45a049; }
        .guest { background: #388e3c; }
        button:hover {
            transform: scale(1.1);
            opacity: 0.9;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Track Your Health 🌿💪</h1>
        <p>Stay fit, eat smart, and reach your goals!</p>
        <div class="buttons">
            <button class="login" onclick="navigate('/login')">Login</button>
            <button class="register" onclick="navigate('/register')">Register</button>
            <button class="guest" onclick="navigate('/home')">Continue as Guest</button>
        </div>
    </div>
    <script>
        function navigate(url) {
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = url;
            }, 500);
        }
    </script>
</body>
</html>
