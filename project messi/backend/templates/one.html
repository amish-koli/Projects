<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Suggestion</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #A8E063, #56AB2F);
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 400px;
            max-width: 90%;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            color: #2e6f4e;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .input-group {
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #c8e6c9;
            margin: 12px 0;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: none;
            font-size: 16px;
            background: none;
            outline: none;
            font-weight: 600;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            background-color: #6bbf59;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            font-size: 16px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            font-weight: 700;
        }
        button:hover {
            background-color: #5aa84d;
            transform: scale(1.05);
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.5s ease-in-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result i {
            font-size: 40px;
            margin-bottom: 10px;
            color: #2e6f4e;
        }
        .video-section h3 {
            color: #2e6f4e;
            font-size: 20px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enter Your Details</h2>
        <div class="input-group">
            <input type="number" id="age" placeholder="Age" required>
        </div>
        <div class="input-group">
            <input type="number" id="height" placeholder="Height (cm)" required>
        </div>
        <div class="input-group">
            <input type="number" id="weight" placeholder="Weight (kg)" required>
        </div>
        <div class="input-group">
            <input type="number" id="calories" placeholder="Calories Consumed" required>
        </div>
        <button onclick="suggestExercise()">Get Exercise Suggestion</button>
        <div class="result" id="exerciseResult"></div>
        <div class="video-section" id="videoSection"></div>
    </div>
    <div class="video-section" id="videoSection"></div>

    <script>
   function suggestExercise() {
    let age = document.getElementById("age").value;
    let height = document.getElementById("height").value;
    let weight = document.getElementById("weight").value;
    let calories = document.getElementById("calories").value;
    let result = document.getElementById("exerciseResult");
    let videoSection = document.getElementById("videoSection");

    if (!age || !height || !weight || !calories) {
        alert("Please fill in all fields.");
        return;
    }

    // Convert inputs to numbers
    age = Number(age);
    height = Number(height);
    weight = Number(weight);
    calories = Number(calories);

    // Validate realistic values
    if (age < 10 || age > 100) {
        alert("Please enter a valid age between 10 and 100.");
        return;
    }
    if (height < 50 || height > 250) {
        alert("Please enter a valid height between 50 cm and 250 cm.");
        return;
    }
    if (weight < 20 || weight > 300) {
        alert("Please enter a valid weight between 20 kg and 300 kg.");
        return;
    }

    let exercise, icon, videoId;

    if (calories < 100) {
        exercise = "Engage in a 15-minute indoor walking workout to boost metabolism.";
        icon = "fas fa-walking";
        videoId = "gnwiTQv9uAM";
    } else if (calories < 250) {
        exercise = "Try a 25-minute HIIT cardio session to burn fat and calories.";
        icon = "fas fa-running";
        videoId = "ml6cT4AZdqI";
    } else if (calories < 400) {
        exercise = "Participate in a 30-minute full-body cardio workout to elevate your heart rate.";
        icon = "fas fa-heartbeat";
        videoId = "I68wYtpP5l0";
    } else if (calories < 600) {
        exercise = "Engage in a 15-minute full-body cardio session to burn calories without equipment.";
        icon = "fas fa-burn";
        videoId = "hlUbgErArHg";
    } else {
        exercise = "Try a 90-minute mixed workout session combining cardio, strength, and flexibility exercises.";
        icon = "fas fa-dumbbell";
        videoId = "UItWltVZZmE";
    }

    result.innerHTML = `<i class='${icon}'></i> ${exercise}`;
    result.style.display = "flex";

    videoSection.innerHTML = `
        <h3>Watch this video for more exercise tips:</h3>
        <div class="video-container">
            <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" alt="Video Thumbnail"
                 class="video-thumbnail" onclick="playVideo('${videoId}')">
        </div>
    `;
    result.scrollIntoView({ behavior: "smooth" });
}
</script>
    
    <style>
    .video-container {
        position: relative;
        width: 100%;
        max-width: 400px;
        cursor: pointer;
    }
    .video-thumbnail {
        width: 100%;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
    }
    .video-thumbnail:hover {
        transform: scale(1.05);
    }
    </style>
    
    
</body>
</html>
