<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fitness Advisor</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #A8E063, #56AB2F);
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 100%;
      max-width: 400px;
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h2 {
      color: #2e6f4e;
      font-size: 24px;
      margin-bottom: 15px;
      font-weight: 700;
    }
    .input-group {
      display: flex;
      align-items: center;
      background: #f5f5f5;
      border-radius: 8px;
      padding: 10px;
      border: 1px solid #c8e6c9;
      margin: 12px 0;
    }
    .input-group input,
    .input-group select {
      width: 100%;
      padding: 12px;
      border: none;
      font-size: 16px;
      background: none;
      outline: none;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      background-color: #6bbf59;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: 0.3s;
      font-size: 16px;
      margin-top: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    button:hover {
      background-color: #5aa84d;
      transform: scale(1.05);
    }
    .result {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
      font-weight: bold;
      display: none;
      flex-direction: column;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .video-section h3 {
      color: #2e6f4e;
      font-size: 20px;
      font-weight: 700;
      margin-top: 20px;
    }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      cursor: pointer;
    }
    .video-thumbnail {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: 0.3s;
    }
    .video-thumbnail:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Get Your Health Suggestions</h2>

    <div class="input-group">
      <select id="mode">
        <option value="calorie">Calorie Suggestion</option>
        <option value="exercise">Exercise Suggestion</option>
      </select>
    </div>

    <div class="input-group">
      <input type="number" id="age" placeholder="Age" required />
    </div>
    <div class="input-group">
      <input type="number" id="height" placeholder="Height (cm)" required />
    </div>
    <div class="input-group">
      <input type="number" id="weight" placeholder="Weight (kg)" required />
    </div>
    <div class="input-group">
      <input type="number" id="calories" placeholder="Calories Consumed" required />
    </div>

    <button onclick="getSuggestion()">Get Suggestion</button>

    <div class="result" id="result"></div>
    <div class="video-section" id="videoSection"></div>
  </div>

  <script>
    async function getSuggestion() {
  const mode = document.getElementById("mode").value;
  const age = document.getElementById("age").value;
  const height = document.getElementById("height").value;
  const weight = document.getElementById("weight").value;
  const calories = document.getElementById("calories").value;
 

  if (!age || !height || !weight || !calories) {
    alert("Please fill in all fields.");
    return;
  }

  try {
    const response = await fetch("/api/one", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({ mode, age, height, weight, calories })
});
    const data = await response.json();

    if (response.ok) {
      const resultDiv = document.getElementById("result");
      const videoSection = document.getElementById("videoSection");

      resultDiv.innerHTML = `<strong>${data.title}</strong><br>${data.message}<br><small>Duration: ${data.duration} | Intensity: ${data.intensity}</small>`;
      resultDiv.style.display = "flex";

      videoSection.innerHTML = `
        <h3>Watch this:</h3>
        <div class="video-container">
          <img src="https://img.youtube.com/vi/${data.videoId}/hqdefault.jpg"
               alt="Video Thumbnail"
               class="video-thumbnail"
               onclick="window.open('https://www.youtube.com/watch?v=${data.videoId}', '_blank')">
        </div>
      `;

      resultDiv.scrollIntoView({ behavior: "smooth" });
    } else {
        console.log("Response data:", data);
alert(data.message || "Something went wrong");

    }
  } catch (error) {
    alert("Error fetching suggestion. Please try again later.");
  }
}

  </script>
</body>
</html>
