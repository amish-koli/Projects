<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account ✍️💚</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f1de;
            color: #333;
            text-align: center;
        }
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            animation: bounceIn 1.5s ease-out;
        }
        form {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
            width: 800px;
            text-align: left;
        }
        input {
            width: 50%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #388e3c;
        }
        .link {
            margin-top: 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Your Account ✍️💚</h1>
        <form id="registerForm" action="#" method="POST">
            <label for="name">🙋 Full Name</label>
            <input type="text" id="name" required>
            <label for="email">📧 Email</label>
            <input type="email" id="email" required>
            <label for="password">🔒 Password</label>
            <input type="password" id="password" required>
            <button  type="submit">Register ✅</button>
        </form>
        <p class="link">Already have an account? <a href='/login'>Login Here 🔑</a></p>
        <p class="link"><a href='/'>⬅️ Back to Home</a></p>
    </div> 
</body>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        let form = document.getElementById("registerForm");

        form.addEventListener("submit", async function(event) {
            event.preventDefault(); 

            console.log("Form submit ho raha hai...");

            // Input values
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            try {
                let response = await fetch("http://127.0.0.1:5000/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                let result = await response.json();
                console.log("Server Response:", result);

                alert(result.message);

                // ✅ Redirect if registration is successful
                if (response.status === 201) {
                    window.location.href = result.redirect;
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Something went wrong!");
            }
        });
    });
</script>


</html>
